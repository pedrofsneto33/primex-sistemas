<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <radialGradient id="glow2" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00C853" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#00C853" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topline2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="50%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="#0A0A0A"/>
  <rect width="1200" height="675" fill="url(#glow2)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#topline2)"/>
  <polygon points="1200,0 1200,80 1120,0" fill="#00C853" opacity="0.15"/>
  <!-- Planilha (grade) vs Sistema (dashboard com barras) -->
  <g transform="translate(120, 250)">
    <rect x="0" y="20" width="80" height="140" rx="8" fill="none" stroke="#9CA3AF" stroke-width="4"/>
    <line x1="0" y1="55" x2="80" y2="55" stroke="#9CA3AF" stroke-width="3"/>
    <line x1="0" y1="90" x2="80" y2="90" stroke="#9CA3AF" stroke-width="3"/>
    <line x1="0" y1="125" x2="80" y2="125" stroke="#9CA3AF" stroke-width="3"/>
    <line x1="40" y1="20" x2="40" y2="160" stroke="#9CA3AF" stroke-width="3"/>
    <rect x="100" y="20" width="80" height="140" rx="8" fill="none" stroke="#00C853" stroke-width="4"/>
    <rect x="112" y="110" width="14" height="36" rx="3" fill="#00C853"/>
    <rect x="131" y="88" width="14" height="58" rx="3" fill="#00C853" opacity="0.8"/>
    <rect x="150" y="62" width="14" height="84" rx="3" fill="#69F0AE"/>
  </g>
  <text x="360" y="270" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#00C853" letter-spacing="4">GESTÃO</text>
  <line x1="360" y1="290" x2="500" y2="290" stroke="#00C853" stroke-width="2" opacity="0.5"/>
  <text x="360" y="360" font-family="Inter, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Planilhas vs Sistema</text>
  <text x="360" y="415" font-family="Inter, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" letter-spacing="-1">de Gestão</text>
  <text x="120" y="600" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#3D3D3D" letter-spacing="3">PRIMEX SISTEMAS</text>
